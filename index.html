<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var desc =
            Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.configurable && (!desc.writable && !desc.set)) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              }
            });
          }
        } catch (e) {
          // Ignore descriptor modification errors in strict sandboxes
        }

        window.addEventListener(
          'error',
          function (event) {
            var msg = event && event.message ? String(event.message) : '';
            var file = event && event.filename ? String(event.filename) : '';
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              file.indexOf('chrome-extension://') === 0 ||
              file.indexOf('moz-extension://') === 0
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <title>TerraCrop AI</title>
    <meta name="description" content="Climate-aware crop rotation decision-support platform utilizing Earth observation, soil conditions, weather trends, and deterministic agro-ecological optimization." />
    <meta property="og:title" content="TerraCrop AI" />
    <meta property="og:description" content="Climate-aware crop rotation decision-support platform utilizing Earth observation, soil conditions, weather trends, and deterministic agro-ecological optimization." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
